name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: py -3.12 -m pip install -e ".[dev]"
      - name: Test
        run: py -3.12 -m pytest -q
      - name: Lint
        run: py -3.12 -m ruff check src tests
      - name: Type check
        run: py -3.12 -m mypy src tests
